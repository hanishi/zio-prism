name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags available so sbt-dynver derives a clean version (no dirty warnings)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # examples and bench are deliberately not aggregated by root, so compile them
      # explicitly — `test` alone would let them break silently.
      - name: Test and compile all modules
        run: sbt -batch test examples/compile bench/compile
